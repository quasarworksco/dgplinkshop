<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda — DGP LinkShop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles/dgp.css" />
</head>
<body class="dgp-lienzo">

  <!-- Cargando -->
  <div id="estado-cargando" class="min-h-screen flex items-center justify-center">
    <div class="flex flex-col items-center gap-3 text-slate-400">
      <div class="w-10 h-10 rounded-full border-2 border-slate-200 border-t-blue-500 animate-spin"></div>
      <p class="text-sm">Cargando tienda…</p>
    </div>
  </div>

  <!-- No encontrada -->
  <div id="estado-error" class="min-h-screen hidden flex-col items-center justify-center px-4 text-center">
    <div class="tarjeta-solida p-10 max-w-md">
      <div class="icono-circulo mx-auto mb-4 w-14 h-14">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900">Tienda no encontrada</h1>
      <p class="text-slate-500 mt-2">Esta dirección no corresponde a ninguna tienda activa de DGP LinkShop.</p>
      <a href="https://dgpgroupusa.com" class="btn btn-primario mt-6">Crear mi propia tienda</a>
    </div>
  </div>

  <!-- Tienda -->
  <div id="estado-tienda" class="hidden">

    <!-- Tasa del dólar -->
    <div id="tienda-tasa-barra" class="hidden text-center text-xs py-1.5 text-white font-medium" style="background:#0f172a">
      Tasa del día: <span id="tienda-tasa"></span>
    </div>

    <!-- Banner -->
    <header class="relative overflow-hidden" id="tienda-banner">
      <div class="contenedor pt-10 pb-12 text-center relative z-10">
        <div id="tienda-logo" class="w-24 h-24 mx-auto rounded-3xl bg-white shadow-lg flex items-center justify-center overflow-hidden ring-1 ring-black/5">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5" class="w-10 h-10"><path d="M3 9 5 3h14l2 6"/><path d="M3 9h18v3a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0Z"/><path d="M5 14v7h14v-7"/></svg>
        </div>
        <h1 id="tienda-nombre" class="mt-4 text-3xl md:text-4xl font-extrabold text-slate-900"></h1>
        <p id="tienda-descripcion" class="text-slate-600 mt-2 max-w-xl mx-auto"></p>
      </div>
    </header>

    <!-- Barra de búsqueda + categorías (sticky) -->
    <div class="sticky top-0 z-20 nav-glass border-y border-slate-200/70">
      <div class="contenedor py-3 space-y-3">
        <div class="relative max-w-xl mx-auto">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </span>
          <input id="tienda-buscar" class="campo pl-10" type="search" placeholder="Buscar productos…" autocomplete="off" />
        </div>
        <div id="tienda-categorias" class="flex gap-2 overflow-x-auto pb-1 justify-start md:justify-center"></div>
      </div>
    </div>

    <main class="contenedor pb-28 pt-8">

      <!-- Más vendidos -->
      <section id="seccion-vendidos" class="hidden mb-10">
        <div class="flex items-center gap-2 mb-4">
          <span class="text-amber-500" id="ico-vendidos"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M12 2 14 9l7 3-7 3-2 7-2-7-7-3 7-3Z"/></svg></span>
          <h2 class="text-lg font-bold text-slate-900">Más vendidos</h2>
        </div>
        <div id="tienda-vendidos" class="flex gap-4 overflow-x-auto pb-3 -mx-1 px-1 snap-x"></div>
      </section>

      <!-- Recomendados (destacados) -->
      <section id="seccion-destacados" class="hidden mb-10">
        <div class="flex items-center gap-2 mb-4">
          <span id="ico-destacados"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
          <h2 class="text-lg font-bold text-slate-900">Recomendados</h2>
        </div>
        <div id="tienda-destacados" class="flex gap-4 overflow-x-auto pb-3 -mx-1 px-1 snap-x"></div>
      </section>

      <!-- Catálogo -->
      <section>
        <h2 id="titulo-catalogo" class="text-lg font-bold text-slate-900 mb-4">Catálogo</h2>
        <div id="tienda-productos" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        <p id="tienda-sin-resultados" class="tarjeta-solida p-10 text-center text-slate-500 hidden">
          No se encontraron productos.
        </p>

        <!-- Paginación -->
        <div id="paginacion" class="hidden items-center justify-center gap-3 mt-8">
          <button id="pag-prev" class="btn btn-claro text-sm">← Anterior</button>
          <span id="pag-info" class="text-sm text-slate-500"></span>
          <button id="pag-next" class="btn btn-claro text-sm">Siguiente →</button>
        </div>
      </section>
    </main>

    <footer class="border-t border-slate-200 bg-white/70">
      <div class="contenedor py-6 text-center text-xs text-slate-500 space-y-1">
        <p>Tienda creada con <a href="https://dgpgroupusa.com" class="text-blue-600 hover:text-blue-700 font-medium">DGP LinkShop</a></p>
        <p>Desarrollado por <a href="https://dgpglobalgroup.com" target="_blank" rel="noopener" class="text-blue-600 hover:text-blue-700 font-semibold">DGP Global Group</a></p>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/tienda.js"></script>
</body>
</html>
