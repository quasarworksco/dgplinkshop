<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda — DGP LinkShop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles/glass.css" />
</head>
<body class="dgp-fondo text-slate-100 antialiased">

  <!-- Estado: cargando -->
  <div id="estado-cargando" class="relative z-10 min-h-screen flex items-center justify-center">
    <div class="glass px-8 py-6 text-slate-300 animate-pulse">Cargando tienda…</div>
  </div>

  <!-- Estado: no encontrada -->
  <div id="estado-error" class="relative z-10 min-h-screen hidden flex-col items-center justify-center px-4 text-center">
    <div class="glass p-10 max-w-md">
      <span data-icono="buscar" data-clases="w-12 h-12 text-slate-400" class="block mx-auto mb-4 w-12 h-12"></span>
      <h1 class="text-2xl font-bold">Tienda no encontrada</h1>
      <p class="text-slate-400 mt-2">Esta dirección no corresponde a ninguna tienda activa de DGP LinkShop.</p>
      <a href="https://dgpgroupusa.com" class="btn-liquid inline-block mt-6 text-sm">Crear mi propia tienda</a>
    </div>
  </div>

  <!-- Tienda -->
  <div id="estado-tienda" class="relative z-10 hidden">
    <main class="max-w-4xl mx-auto px-4 pb-28 pt-10">

      <!-- Cabecera del negocio -->
      <header class="glass p-8 text-center">
        <div id="tienda-logo" class="w-24 h-24 mx-auto rounded-2xl glass flex items-center justify-center overflow-hidden text-slate-300">
          <span data-icono="tienda" data-clases="w-10 h-10"></span>
        </div>
        <h1 id="tienda-nombre" class="mt-4 text-3xl font-extrabold"></h1>
        <p id="tienda-descripcion" class="text-slate-300 mt-2 max-w-xl mx-auto"></p>
      </header>

      <!-- Catálogo -->
      <section class="mt-8" aria-label="Catálogo de productos">
        <div id="tienda-productos" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
        <p id="tienda-sin-productos" class="glass p-10 text-center text-slate-400 hidden">
          Esta tienda aún está preparando su catálogo. ¡Vuelve pronto!
        </p>
        <!-- Centinela del scroll infinito: al verse, carga la siguiente página -->
        <div id="sentinela-scroll" class="h-8 mt-4 flex items-center justify-center text-slate-500 text-xs hidden">
          Cargando más productos…
        </div>
      </section>
    </main>

    <!-- Footer institucional DGP -->
    <footer class="relative z-10 text-center text-xs text-slate-500 pb-8 space-y-1">
      <p>Tienda creada con <a href="https://dgpgroupusa.com" class="text-indigo-300 hover:text-indigo-200 transition">DGP LinkShop</a></p>
      <p>Desarrollado por <a href="https://dgpglobalgroup.com" target="_blank" rel="noopener" class="text-indigo-300 hover:text-indigo-200 transition font-semibold">DGP Global Group</a></p>
    </footer>
  </div>

  <script type="module" src="/src/tienda.js"></script>
</body>
</html>
