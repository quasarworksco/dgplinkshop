<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi panel — DGP LinkShop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles/glass.css" />
</head>
<body class="dgp-fondo text-slate-100 antialiased">

  <header class="relative z-10 max-w-6xl mx-auto flex items-center justify-between px-6 py-6">
    <img src="/assets/logo.svg" alt="DGP LinkShop" class="h-9" />
    <div class="flex items-center gap-4">
      <a id="ver-tienda" href="#" target="_blank" rel="noopener" class="glass glass-hover px-4 py-2 rounded-full text-sm font-semibold">👁️ Ver mi tienda</a>
      <button id="btn-logout" class="text-sm text-slate-400 hover:text-white transition">Salir</button>
    </div>
  </header>

  <main class="relative z-10 max-w-6xl mx-auto px-6 pb-16">

    <!-- Encabezado del negocio -->
    <section class="glass p-6 flex flex-col md:flex-row md:items-center gap-5">
      <div id="panel-logo" class="w-16 h-16 rounded-2xl glass flex items-center justify-center text-2xl overflow-hidden shrink-0">🏪</div>
      <div class="flex-1 min-w-0">
        <h1 id="panel-nombre" class="text-2xl font-bold truncate">Cargando…</h1>
        <a id="panel-url" href="#" target="_blank" rel="noopener" class="text-sm text-cyan-300 hover:underline break-all"></a>
      </div>
      <div class="glass px-5 py-3 text-center">
        <p class="text-xs text-slate-400 uppercase tracking-wide">Plan</p>
        <p id="panel-plan" class="font-bold text-indigo-300">—</p>
      </div>
      <div class="glass px-5 py-3 text-center">
        <p class="text-xs text-slate-400 uppercase tracking-wide">Productos</p>
        <p class="font-bold"><span id="panel-conteo">0</span><span class="text-slate-400">/<span id="panel-limite">5</span></span></p>
      </div>
    </section>

    <!-- Aviso de límite / upgrade -->
    <div id="aviso-limite" class="glass p-4 mt-4 hidden items-center justify-between gap-4 flex-wrap" style="border-color: rgba(251,191,36,0.4)">
      <p class="text-sm text-amber-300">⚡ Alcanzaste el límite de tu plan. Mejora a <strong>PRO</strong> ($30 inscripción + $20/mes) y vende hasta 50 productos.</p>
      <button id="btn-upgrade" class="btn-liquid text-sm">Quiero el plan PRO</button>
    </div>

    <!-- Catálogo -->
    <section class="mt-8">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-xl font-bold">Mi catálogo</h2>
        <button id="btn-nuevo-producto" class="btn-liquid text-sm">+ Añadir producto</button>
      </div>
      <div id="lista-productos" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      <p id="catalogo-vacio" class="glass p-10 text-center text-slate-400 hidden">
        Aún no tienes productos. ¡Añade el primero y empieza a vender! 🚀
      </p>
    </section>
  </main>

  <!-- Modal producto -->
  <div id="modal-producto" class="fixed inset-0 z-40 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="glass p-8 w-full max-w-md max-h-[90vh] overflow-y-auto">
      <h3 id="modal-titulo" class="text-xl font-bold mb-6">Nuevo producto</h3>
      <form id="form-producto" class="space-y-4">
        <input type="hidden" id="prod-id" />
        <div>
          <label for="prod-nombre" class="block text-sm mb-1 text-slate-300">Nombre *</label>
          <input id="prod-nombre" class="input-glass" required maxlength="120" placeholder="Ej: Pastel de chocolate" />
        </div>
        <div>
          <label for="prod-precio" class="block text-sm mb-1 text-slate-300">Precio *</label>
          <input id="prod-precio" class="input-glass" type="number" min="0" step="0.01" required placeholder="0.00" />
        </div>
        <div>
          <label for="prod-descripcion" class="block text-sm mb-1 text-slate-300">Descripción</label>
          <textarea id="prod-descripcion" class="input-glass" rows="2" maxlength="300"></textarea>
        </div>
        <div>
          <label for="prod-imagen" class="block text-sm mb-1 text-slate-300">Foto del producto</label>
          <input id="prod-imagen" type="file" accept="image/jpeg,image/png,image/webp" class="input-glass text-sm" />
          <div id="prod-progreso" class="barra-progreso mt-2 hidden"><div style="width:0%"></div></div>
        </div>
        <p id="modal-error" class="text-rose-400 text-sm hidden"></p>
        <div class="flex gap-3 pt-2">
          <button type="button" id="btn-cancelar" class="glass glass-hover flex-1 py-2.5 rounded-full text-sm font-semibold">Cancelar</button>
          <button type="submit" id="btn-guardar-producto" class="btn-liquid flex-1 text-sm">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/panel.js"></script>
</body>
</html>
