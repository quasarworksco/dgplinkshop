<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restablecer contraseña — DGP LinkShop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles/dgp.css" />
</head>
<body class="dgp-lienzo min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-md">
    <a href="/public/index.html" class="block text-center mb-8">
      <img src="/assets/logo.svg" alt="DGP LinkShop" class="h-10 mx-auto" />
    </a>

    <div class="tarjeta-solida p-8">
      <!-- Verificando -->
      <div id="rec-cargando" class="text-center py-6">
        <div class="w-8 h-8 mx-auto rounded-full border-2 border-slate-200 border-t-blue-500 animate-spin"></div>
        <p class="text-sm text-slate-500 mt-3">Verificando el enlace…</p>
      </div>

      <!-- Enlace inválido -->
      <div id="rec-invalido" class="hidden text-center py-4">
        <h1 class="text-xl font-bold text-slate-900">Enlace inválido o expirado</h1>
        <p class="text-slate-500 mt-2 text-sm">Solicita un nuevo enlace de recuperación desde el inicio de sesión.</p>
        <a href="/public/acceso.html" class="btn btn-primario mt-6">Ir a iniciar sesión</a>
      </div>

      <!-- Formulario nueva contraseña -->
      <form id="rec-form" class="hidden space-y-4">
        <h1 class="text-2xl font-extrabold text-slate-900">Crea tu nueva contraseña</h1>
        <div>
          <label for="rec-nueva" class="block text-sm font-medium text-slate-700 mb-1.5">Nueva contraseña</label>
          <input type="password" id="rec-nueva" class="campo" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password" />
        </div>
        <div>
          <label for="rec-confirmar" class="block text-sm font-medium text-slate-700 mb-1.5">Repite la contraseña</label>
          <input type="password" id="rec-confirmar" class="campo" placeholder="••••••••" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primario w-full">Guardar contraseña</button>
        <p id="rec-msg" class="text-sm text-center hidden"></p>
      </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">© 2026 DGP LinkShop · dgpgroupusa.com</p>
  </div>

  <script type="module" src="/src/recuperar.js"></script>
</body>
</html>
